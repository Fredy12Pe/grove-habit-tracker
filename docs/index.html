<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grove — Support</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f9faf1;
        --text: #213242;
        --muted: #807e71;
        --accent: #5a7a20;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141a17;
          --text: #f0f2e8;
          --muted: #9a9b8a;
          --accent: #a7de33;
        }
      }
      body {
        margin: 0;
        font-family: ui-rounded, system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1rem;
      }
      ul {
        padding-left: 1.2rem;
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Grove Support</h1>
      <p>
        Grove is a habit tracker with a garden-style world and calming
        mini-activities. For help, email
        <a href="mailto:support@grovehabits.app">support@grovehabits.app</a>.
      </p>
      <ul>
        <li><a href="./legal/privacy.html">Privacy Policy</a></li>
        <li><a href="./legal/terms.html">Terms of Use</a></li>
      </ul>
    </main>
  </body>
</html>
